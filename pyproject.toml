[build-system]
requires = [ "setuptools>=41.0.1",]
build-backend = "setuptools.build_meta"

[tool.xcookie]
tags = [ "kitware", "gitlab", "purepy"]
mod_name = "kwdagger"
repo_name = "kwdagger"
pkg_name = "kwdagger"
rel_mod_parent_dpath = "."
os = [ "linux", "osx", "win",]
min_python = "3.10"
author = "Jon Crall"
author_email = "jon.crall@kitware.com"
description = "The kwdagger module"
license = "Apache 2"
dev_status = "planning"
remote_host = "https://gitlab.kitware.com"
remote_group = "computer-vision"

[tool.xcookie.entry_points]
# the console_scripts entry point creates the xdoctest executable
console_scripts = [
    "kwdagger = kwdagger.__main__:main",
]

[tool.pytest.ini_options]
addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py --ignore-glob=dev --ignore-glob=docs"
norecursedirs = ".git ignore build __pycache__ dev _skbuild docs"
filterwarnings = [ "default", "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning", "ignore:.*Define the __nice__ method for.*:Warning", "ignore:.*private pytest class or function.*:Warning",]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", ".*  # pragma: no cover", ".*  # nocover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if 0:", "if trace is not None", "verbose = .*", "^ *raise", "^ *pass *$", "if _debug:", "if __name__ == .__main__.:", ".*if six.PY2:",]
omit = [ "kwdagger/__main__.py", "*/setup.py",]

[tool.mypy]
ignore_missing_imports = true
#ignore_errors = true

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
unresolved-import = "ignore"
possibly-missing-submodule = "ignore"

[tool.ruff]
line-length = 80
target-version = "py38"

[tool.ruff.lint]
# Enable Flake8 (E, F) and isort (I) rules.
select = ["E", "F", "I"]
# Ignore specific rules, for example, E501 (line too long) as it's handled by the formatter.
ignore = [
    "E501",  # line too long
    "E402",  # Module level import not at top of file
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
