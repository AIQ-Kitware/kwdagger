nodes:
  train:
    executable: "python gather_demo.py train"
    in_paths: [data_fpath]
    out_paths:
      checkpoint_fpath: checkpoint.txt
    algo_params:
      algorithm: linear
      seed: 0
      fold: 0

  build_ensemble:
    executable: "python gather_demo.py ensemble"
    in_paths: [checkpoints_fpath]
    out_paths:
      ensemble_fpath: ensemble.txt
    algo_params:
      algorithm: linear
      seed: 0

  evaluate:
    executable: "python gather_demo.py evaluate"
    in_paths: [ensemble_fpath]
    out_paths:
      metrics_fpath: metrics.json
    algo_params:
      algorithm: linear
      seed: 0
      test_set: clean

edges:
  - src: train.checkpoint_fpath
    dst: build_ensemble.checkpoints_fpath
    gather:
      group_by: [algorithm, seed]
      order_by: [fold]
      require: all_success

  - build_ensemble.ensemble_fpath -> evaluate.ensemble_fpath
